services:
  # The fullstack Kanban app (FastAPI backend serving React frontend)
  - type: web
    name: kanban-app
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kanban-db
          property: connectionString

databases:
  # Free PostgreSQL database on Render
  - name: kanban-db
    plan: free
    region: oregon
    databaseName: kanban
    user: kanban_user
