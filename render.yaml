services:
  # =========================================================================
  # DEV ENVIRONMENT (Development Stack)
  # =========================================================================
  - type: web
    name: kanban-app-dev
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    branch: main
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kanban-db-dev
          property: connectionString
      - key: OTEL_SERVICE_NAME
        value: kanban-backend
      - key: ENVIRONMENT
        value: development
      - key: APP_VERSION
        value: 0.1.0

  # =========================================================================
  # PROD ENVIRONMENT (Production Stack)
  # =========================================================================
  - type: web
    name: kanban-app-prod
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    branch: main
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kanban-db-prod
          property: connectionString
      - key: OTEL_SERVICE_NAME
        value: kanban-backend
      - key: ENVIRONMENT
        value: production
      - key: APP_VERSION
        value: 0.1.0

databases:
  # Dev PostgreSQL Database
  - name: kanban-db-dev
    plan: free
    region: oregon
    databaseName: kanban_dev
    user: kanban_dev_user

  # Prod PostgreSQL Database (Independent from Dev)
  - name: kanban-db-prod
    plan: free
    region: oregon
    databaseName: kanban_prod
    user: kanban_prod_user
