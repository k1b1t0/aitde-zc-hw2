[project]
name = "backend"
version = "0.1.0"
description = "Mini Collaborative Kanban FastAPI Backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bcrypt<4.1.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "passlib>=1.7.4",
    "pydantic>=2.13.5",
    "pyjwt>=2.14.0",
    "pytest>=9.1.1",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.52.4",
    "websockets>=17.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
