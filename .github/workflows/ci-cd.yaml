name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  # =========================================================================
  # 1. Parallel Unit Tests: Backend & Frontend
  # =========================================================================
  test-backend:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Backend Dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Run Pytest Unit Tests
        working-directory: backend
        run: uv run pytest tests/test_backend.py

  test-frontend:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Vitest Unit Tests
        working-directory: frontend
        run: npm test

  # =========================================================================
  # 2. Integration & End-to-End Tests against Docker Compose Stack
  # =========================================================================
  integration-and-e2e:
    name: Docker Compose Integration & Playwright E2E Tests
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Backend and Playwright Dependencies
        working-directory: backend
        run: |
          uv sync --frozen
          uv run playwright install --with-deps chromium

      - name: Start Docker Compose Stack (Postgres + App)
        run: docker compose up -d --build

      - name: Wait for App Health Check
        run: |
          echo "Waiting for app service to be healthy..."
          for i in {1..30}; do
            if curl -s http://localhost:8000/api/v1/health | grep -q '"status":"ok"'; then
              echo "App is healthy and serving requests!"
              exit 0
            fi
            echo "Waiting ($i/30)..."
            sleep 2
          done
          echo "App failed to start in time. Logs:"
          docker compose logs
          exit 1

      - name: Run Integration Tests
        working-directory: backend
        run: uv run pytest tests/test_integration_compose.py

      - name: Run Playwright End-to-End Collaboration Tests
        working-directory: backend
        run: uv run pytest ../e2e/test_collaboration_e2e.py

      - name: Teardown Docker Compose Stack
        if: always()
        run: docker compose down -v

  # =========================================================================
  # 3. Stage 1: Build Image & Push to Container Registry (GHCR)
  # =========================================================================
  build-and-push:
    name: Build & Push Docker Image to Registry
    needs: [integration-and-e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
      image_uri: ${{ steps.tag.outputs.image_uri }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate YYYYMMDD-HHMMSS-shortsha Tag
        id: tag
        run: |
          TIMESTAMP=$(date -u +'%Y%m%d-%H%M%S')
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAG="${TIMESTAMP}-${SHORT_SHA}"
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_URI="ghcr.io/${REPO_LOWER}:${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "repo_lower=${REPO_LOWER}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "Generated tag: ${TAG}"
          echo "Image URI: ${IMAGE_URI}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.tag.outputs.image_uri }}
            ghcr.io/${{ steps.tag.outputs.repo_lower }}:dev-latest
            ghcr.io/${{ steps.tag.outputs.repo_lower }}:latest

  # =========================================================================
  # 4. Stage 2: Deploy to Dev on Render & Post-Deploy Health Validation
  # =========================================================================
  deploy-dev:
    name: Deploy to Dev on Render & Validate Health
    needs: [build-and-push]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dev Render Deploy Hook
        env:
          DEV_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEV_DEPLOY_HOOK_URL || secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEV_DEPLOY_HOOK_URL" ]; then
            echo "Neither RENDER_DEV_DEPLOY_HOOK_URL nor RENDER_DEPLOY_HOOK_URL secret is set. Skipping auto-deploy."
            exit 0
          fi
          echo "Triggering deployment on Render Dev via Deploy Hook..."
          curl -f -X POST "${DEV_DEPLOY_HOOK_URL}"
          echo "Dev deploy triggered successfully."

      - name: Validate Dev Health Endpoint
        env:
          DEV_APP_URL: ${{ secrets.RENDER_DEV_APP_URL || secrets.RENDER_APP_URL }}
        run: |
          if [ -z "$DEV_APP_URL" ]; then
            echo "Neither RENDER_DEV_APP_URL nor RENDER_APP_URL secret is set. Skipping health check."
            exit 0
          fi

          # Strip trailing slash and any trailing /api or /api/v1 if user included it in secret
          CLEAN_URL=$(echo "$DEV_APP_URL" | sed -e 's|/*$||' -e 's|/api/v1$||' -e 's|/api$||')
          HEALTH_URL="${CLEAN_URL}/api/v1/health"

          echo "Validating health endpoint at ${HEALTH_URL}..."
          # Allow up to 5 minutes (50 * 6s) for Render free-tier cold start & build rollout
          for i in {1..50}; do
            RESPONSE=$(curl -s -L --max-time 10 "${HEALTH_URL}" || true)
            if echo "$RESPONSE" | grep -q '"status":"ok"'; then
              echo "SUCCESS: Dev health check passed!"
              exit 0
            fi
            echo "Waiting for live rollout ($i/50)... Response: $RESPONSE"
            sleep 6
          done
          echo "Dev health check failed after timeout. Last response: $RESPONSE"
          exit 1
